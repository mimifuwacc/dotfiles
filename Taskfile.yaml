version: "3"

silent: true

tasks:
  default:
    cmds:
      - task edit

  tasks:
    desc: "Show task list"
    cmds:
      - task --list

  edit:
    desc: "Open dotfiles in editor"
    cmds:
      - code ~/dotfiles

  apply:
    desc: "Apply Nix configuration"
    vars:
      HOSTNAME:
        sh: hostname -s | tr '[:upper:]' '[:lower:]'
      EXTRA_ARGS: '{{.EXTRA_ARGS | default ""}}'
    cmds:
      - |
        TARGET="{{.CLI_ARGS}}"
        TARGET="${TARGET:-{{.HOSTNAME}}}"

        DIR="$HOME/dotfiles/system/darwin/$TARGET"

        if [ ! -d "$DIR" ]; then
          echo "Error: System config for \"$TARGET\" not found at $DIR"
          exit 1
        fi

        exec "$HOME/dotfiles/system/darwin/apply.sh" "$TARGET" {{.EXTRA_ARGS}}

  apply:update:
    desc: "Update flake.lock and apply"
    cmds:
      - task: apply
        vars: { EXTRA_ARGS: "--update" }

  test:
    desc: "Run all tests"
    cmds:
      - task: test:prompt-glyph

  test:prompt-glyph:
    desc: "Test the Starship prompt glyph font build"
    dir: fonts/prompt-glyph
    cmds:
      # Set inline because some shells export this empty, which uv rejects.
      - UV_PYTHON_DOWNLOADS=auto uv run --frozen pytest -q
